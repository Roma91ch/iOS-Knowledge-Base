name: Sync theme once

on:
  push:
    paths:
      - '.github/workflows/sync-theme-once.yml'

permissions:
  contents: write

jobs:
  patch-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject shared theme script
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('modules/combine/index.html'),
              Path('modules/swift-concurrency/index.html'),
              Path('modules/mobile-system-design/index.html'),
          ]
          script = '  <script src="../../assets/theme.js"></script>\n'

          for path in paths:
              text = path.read_text(encoding='utf-8')
              if '../../assets/theme.js' in text:
                  continue
              if '</body>' not in text:
                  raise RuntimeError(f'Missing </body> in {path}')
              path.write_text(text.replace('</body>', script + '</body>', 1), encoding='utf-8')

      - name: Commit synchronized theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/combine/index.html modules/swift-concurrency/index.html modules/mobile-system-design/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Share theme across knowledge base pages"
          git push
