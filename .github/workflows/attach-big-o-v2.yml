name: Attach Big O v2 fixes

on:
  push:
    paths:
      - '.github/workflows/attach-big-o-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach Big O v2 runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('modules/big-o/index.html')
          text = path.read_text()
          script = '  <script src="../../assets/big-o-v2.js"></script>\n'
          if 'assets/big-o-v2.js' not in text:
              text = text.replace('</body>', script + '</body>', 1)
              path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/big-o/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Attach Big O v2 light mode and chart fixes"
          git push
