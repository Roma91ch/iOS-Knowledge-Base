name: Switch mobile header v2

on:
  push:
    paths:
      - '.github/workflows/switch-mobile-header-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch module headers to cache-safe stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('modules/combine/index.html'),
              Path('modules/swift-concurrency/index.html'),
              Path('modules/mobile-system-design/index.html'),
          ]

          for path in files:
              text = path.read_text()
              text = text.replace('../../assets/mobile-header.css', '../../assets/mobile-header-v2.css')
              path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use cache-safe portrait mobile headers"
          git push
