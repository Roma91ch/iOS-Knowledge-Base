name: Link card layout v2

on:
  push:
    paths:
      - '.github/workflows/link-card-layout-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link landing card stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          link = '  <link rel="stylesheet" href="assets/card-layout-v2.css">\n'
          if 'assets/card-layout-v2.css' not in text:
              text = text.replace('</head>', link + '</head>', 1)
              path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use flexible landing card layout"
          git push
